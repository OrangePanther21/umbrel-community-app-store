manifestVersion: 1
id: robosats-tools-robosats-notifier
category: finance
name: RoboSats Notifier
version: "1.3.0"
tagline: Get instant notifications for new RoboSats offers
icon: https://raw.githubusercontent.com/OrangePanther21/umbrel-community-app-store/master/robosats-tools-robosats-notifier/icon.svg
description: >-
  Unofficial community tool - Monitor RoboSats order book and receive instant notifications when new offers match your criteria. This is an independent community project, not officially affiliated with RoboSats.
  
  Features: Real-time monitoring of RoboSats offers across multiple coordinators. Instant notifications for new matching offers (WhatsApp supported). Daily summary reports with BTC prices and offer statistics. Web UI for easy configuration. QR code authentication. Filter by currencies and coordinators. Customizable check intervals.
  
  Requirements: RoboSats app must be installed. Messaging account for notifications (WhatsApp currently supported).
  
  Configuration: Access the web UI after installation. Scan QR code to authenticate. Configure your target currencies and notification settings. Adjust check interval and other settings.
