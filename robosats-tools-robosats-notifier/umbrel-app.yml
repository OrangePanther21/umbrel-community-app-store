releaseNotes: >-
  Version 1.4.0 - Clearnet URL Support
  
  New Features:
  - Clearnet URL: Configure an optional RoboSats clearnet URL so offer notifications include a direct clearnet link
  - New ROBOSATS_CLEARNET_URL setting available in web UI and environment variables
  
  Bug Fixes:
  - Improved message deletion logging — non-existent messages are now treated as successfully deleted
