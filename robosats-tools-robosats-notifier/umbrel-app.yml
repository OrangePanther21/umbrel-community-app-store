releaseNotes: >-
  Version 1.3.0 - Daily Summary Feature
  
  New Features:
  - Daily Summary: Receive scheduled daily reports with BTC prices, offer statistics, and coordinator health
  - Configurable summary time and timezone via web UI
  - Support for multiple BTC price currencies with 24h price movement
  - Volume statistics per coordinator
  - Customizable closing messages
  - Reset statistics endpoint for data management
  
  Improvements:
  - Upgraded whatsapp-web.js to v1.34.6
  - Improved timezone handling and error logging
  - Better rate limiting for external API calls
  - Enhanced stats tracking with hourly bucket rotation
